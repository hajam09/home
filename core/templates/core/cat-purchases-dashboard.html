{% extends 'core/base.html' %}
{% load custom_filters %}
{% load static %}
{% block content %}
    <link rel='stylesheet' href='https://cdn.datatables.net/2.0.0/css/dataTables.dataTables.css'/>
    <div class='container mt-5' style='color: black; max-width: 90%'>
        <div id='total_and_average' class='mt-3'></div>
        <div id='retailer_and_weight' class='mt-3'></div>
        <div class="row">
            <div class="col">
                <div id='top_expensive_purchases_table' class='mt-3'></div>
            </div>
            <div class="col">
                <div id='total_annual_cost_table' class='mt-3'></div>
            </div>
        </div>

        <div class='row mt-3'>
            <div class="col">
                <canvas id='spending_amount_for_each_retailer'></canvas>
            </div>
            <div class="col">
                <canvas id='spending_count_for_each_retailer'></canvas>
            </div>
        </div>

        <div class='row mt-3'>
            <div class="col">
                <canvas id='average_spending_for_each_retailer'></canvas>
            </div>
            <div class="col">

            </div>
        </div>

        <div class='row mt-3'>
            <div class="col">
                <canvas id='monthly_spending'></canvas>
            </div>
        </div>

        <div id='all_purchase_detail_table' class='mt-3'></div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/chart.js@3.0.0/dist/chart.js'></script>
    <script src='https://cdn.datatables.net/2.0.0/js/dataTables.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0/dist/chartjs-plugin-datalabels.min.js'></script>
    <script src="{% static 'js/core-functions.js' %}"></script>
    <script>

        window.onload = function () {
            fetch('{% url 'core:v1-cat-purchases-analytics-api' %}')
                .then(response => response.json())
                .then(data => {
                    create_utilities_cards(
                        'total_and_average',
                        [data.total_spending, data.number_of_purchases, data.average_per_purchase, data.average_monthly_spend]
                    );

                    create_utilities_cards(
                        'retailer_and_weight',
                        [data.most_common_retailer, data.total_weight_purchased]
                    );

                    create_table(
                        'top_expensive_purchases_table',
                        data.top_expensive_purchases.title,
                        data.top_expensive_purchases.value,
                    );
                    create_table(
                        'total_annual_cost_table',
                        data.total_annual_cost.title,
                        data.total_annual_cost.value,
                    );

                    create_bar_chart(
                        'spending_amount_for_each_retailer',
                        data.spending_amount_for_each_retailer.map(item => item.retailer),
                        [
                            {
                                label: 'Total Spend (£)',
                                data: data.spending_amount_for_each_retailer.map(item => item.total_spent),
                                backgroundColor: '#4e79a7'
                            }
                        ],
                        'Total Spend Per Retailer'
                    );
                    create_bar_chart(
                        'spending_count_for_each_retailer',
                        data.spending_count_for_each_retailer.map(item => item.retailer),
                        [
                            {
                                label: 'Total Spend (£)',
                                data: data.spending_count_for_each_retailer.map(item => item.purchases_count),
                                backgroundColor: '#4e79a7'
                            }
                        ],
                        'Spend Count Per Retailer'
                    );
                    create_bar_chart(
                        'average_spending_for_each_retailer',
                        data.average_spending_for_each_retailer.map(item => item.retailer),
                        [
                            {
                                label: 'Total Spend (£)',
                                data: data.average_spending_for_each_retailer.map(item => item.average_spent),
                                backgroundColor: '#4e79a7'
                            }
                        ],
                        'Avg. Spend Per Retailer'
                    );
                    create_bar_chart(
                        'monthly_spending',
                        data.monthly_spending.map(item => item.month),
                        [
                            {
                                label: 'Total Spend (£)',
                                data: data.monthly_spending.map(item => item.total_spent),
                                backgroundColor: '#4e79a7'
                            }
                        ],
                        'Monthly Spending'
                    );

                    create_table('all_purchase_detail_table', data.all_purchase_detail.title, data.all_purchase_detail.value);

                    new DataTable('#all_purchase_detail_table table');
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                });
        }
    </script>
{% endblock %}
