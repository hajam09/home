{% extends 'core/base.html' %}
{% load static %}
{% block content %}

    <div class='container mt-5'>
        <div id='backup-alert'></div>
        <button type='button' class='btn btn-primary btn-sm btn-block' id='db-backup-btn'>Back up Database</button>
    </div>

    <script>

        function createAlert(isSuccess, message) {
            const div = document.createElement('div');
            div.className = isSuccess ? 'alert alert-success' : 'alert alert-danger';
            div.setAttribute('role', 'alert');
            div.textContent = message;
            return div;
        }

        document.getElementById('db-backup-btn').addEventListener('click', function () {
            const alertElement = document.getElementById('backup-alert');
            fetch("{% url 'core:v1-database-backup-api' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
            }).then(response => response.json())
                .then(data => {
                    alertElement.replaceChildren(createAlert(data.success, data.message));
                })
                .catch(error => {
                    alertElement.replaceChildren(createAlert(false, error));
                });
        });
    </script>
{% endblock %}
